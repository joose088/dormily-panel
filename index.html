<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<style>
  /* Layout: navy brand band with the team's numbers, then one working view at a time. */
  :root {
    --bg: #FBF8F3; --surface: #FFFFFF; --sunk: #F3EEE6; --ink: #0E0E2C; --muted: #565670; --line: rgba(14,14,44,.12);
    --band: #0E0E2C; --band-ink: #FFF6EC; --band-muted: rgba(255,246,236,.72);
    --accent: #2F3BFF; --accent-ink: #FFFFFF; --accent-soft: #E7E9FF;
    --rosa: #C2185B; --rosa-soft: #FFE1EE; --rosa-band: #FF7AB6;
    --ok: #1C7C52; --ok-soft: #DDF3E8; --warn: #9A6100; --warn-soft: #FFF0D1; --bad: #C22A47; --bad-soft: #FFE0E5;
    --p-jc: #2F3BFF; --p-alejandro: #C2185B; --p-hugo: #1C7C52; --p-todos: #0E0E2C;
    --f-display: 'Unbounded', 'Arial Black', sans-serif; --f-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    --r: 12px; --sombra: 0 1px 2px rgba(14,14,44,.06), 0 6px 20px rgba(14,14,44,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0B1E; --surface: #15152D; --sunk: #1C1C38; --ink: #FFF6EC; --muted: #B0B0CC; --line: rgba(255,246,236,.13);
      --band: #12122A; --band-ink: #FFF6EC; --band-muted: rgba(255,246,236,.7);
      --accent: #8A91FF; --accent-ink: #0B0B1E; --accent-soft: rgba(138,145,255,.16);
      --rosa: #FF8FC0; --rosa-soft: rgba(255,122,182,.16); --rosa-band: #FF7AB6;
      --ok: #55D199; --ok-soft: rgba(85,209,153,.14); --warn: #F4BC5A; --warn-soft: rgba(244,188,90,.14); --bad: #FF7A92; --bad-soft: rgba(255,122,146,.14);
      --p-jc: #8A91FF; --p-alejandro: #FF8FC0; --p-hugo: #55D199; --p-todos: #FFF6EC;
      --sombra: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B0B1E; --surface: #15152D; --sunk: #1C1C38; --ink: #FFF6EC; --muted: #B0B0CC; --line: rgba(255,246,236,.13);
    --band: #12122A; --band-ink: #FFF6EC; --band-muted: rgba(255,246,236,.7);
    --accent: #8A91FF; --accent-ink: #0B0B1E; --accent-soft: rgba(138,145,255,.16);
    --rosa: #FF8FC0; --rosa-soft: rgba(255,122,182,.16); --rosa-band: #FF7AB6;
    --ok: #55D199; --ok-soft: rgba(85,209,153,.14); --warn: #F4BC5A; --warn-soft: rgba(244,188,90,.14); --bad: #FF7A92; --bad-soft: rgba(255,122,146,.14);
    --p-jc: #8A91FF; --p-alejandro: #FF8FC0; --p-hugo: #55D199; --p-todos: #FFF6EC;
    --sombra: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .envoltorio { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* Band */
  .banda { background: var(--band); color: var(--band-ink); }
  .banda .envoltorio { padding-block: 22px 18px; display: grid; gap: 18px; }
  .banda__top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .marca { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; margin: 0; }
  .marca span { color: var(--rosa-band); }
  .hoy { color: var(--band-muted); font-size: 14px; }
  .estado-con { margin-left: auto; font-size: 13px; color: var(--band-muted); display: inline-flex; align-items: center; gap: 6px; }
  .estado-con i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }
  .estado-con.ok i { background: #55D199; }
  .estado-con.mal i { background: #FF7A92; }
  .cifras { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .cifra { background: rgba(255,246,236,.07); border: 1px solid rgba(255,246,236,.12); border-radius: var(--r); padding: 12px 14px; min-width: 0; text-align: left; color: inherit; }
  button.cifra:hover { background: rgba(255,246,236,.12); }
  .cifra b { display: block; font-family: var(--f-display); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .cifra span { font-size: 12.5px; color: var(--band-muted); }
  .cifra.alerta b { color: #FF8FA3; }
  .cifra .prox { font-family: var(--f-body); font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Tabs */
  .barra { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-block: 18px 6px; }
  .pestanas { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 4px; gap: 2px; }
  .pestana { border: 0; background: transparent; padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--muted); }
  .pestana[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--sombra); }
  .barra .acciones { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primario { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.peligro { color: var(--bad); border-color: var(--bad); background: transparent; }
  .btn.peligro.armado { background: var(--bad); color: #fff; }
  .solo-lectura .solo-escritura { display: none !important; }
  .aviso { background: var(--warn-soft); color: var(--ink); border-radius: var(--r); padding: 10px 14px; font-size: 14px; margin-top: 12px; }

  /* Filters */
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 10px; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .punto { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  .filtros select { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 13.5px; }
  .filtros label.chk { font-size: 13.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }

  /* Board */
  .tablero { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding-bottom: 40px; }
  .columna { background: var(--sunk); border-radius: 16px; padding: 12px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .columna h2 { font-family: var(--f-display); font-size: 13px; letter-spacing: .02em; margin: 2px 4px 2px; display: flex; align-items: center; gap: 8px; }
  .columna h2 .n { font-family: var(--f-body); font-weight: 700; color: var(--muted); font-size: 13px; }
  .vacio { color: var(--muted); font-size: 13.5px; padding: 14px 6px; text-align: center; border: 1.5px dashed var(--line); border-radius: 10px; }
  .tarjeta { background: var(--surface); border-radius: var(--r); box-shadow: var(--sombra); padding: 11px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; border-left: 4px solid transparent; }
  .tarjeta.alta { border-left-color: var(--rosa); }
  .tarjeta.hecha .tit { text-decoration: line-through; color: var(--muted); }
  .tarjeta .marcar { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: transparent; padding: 0; margin-top: 1px; display: grid; place-items: center; }
  .tarjeta .marcar:hover { border-color: var(--ok); }
  .tarjeta.hecha .marcar { background: var(--ok); border-color: var(--ok); }
  .tarjeta.hecha .marcar::after { content: ''; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
  .tarjeta .tit { border: 0; background: none; padding: 0; text-align: left; font-weight: 700; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
  .tarjeta .tit:hover { color: var(--accent); }
  .tarjeta .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .tarjeta .det { grid-column: 2; font-size: 13px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pers { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; color: var(--ink); }
  .ini { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--surface); flex: none; }
  .etq { background: var(--sunk); border-radius: 6px; padding: 1px 7px; color: var(--muted); }
  .fecha.vencida { color: var(--bad); font-weight: 700; }
  .fecha.pronto { color: var(--warn); font-weight: 700; }
  .mover { grid-column: 2; display: flex; gap: 6px; margin-top: 4px; }
  .mover button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
  .mover button:hover { color: var(--accent); border-color: var(--accent); }

  /* Calendar */
  .cal-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; padding-bottom: 40px; align-items: start; }
  .cal { background: var(--surface); border-radius: 16px; box-shadow: var(--sombra); padding: 14px; min-width: 0; }
  .cal-cab { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .cal-cab h2 { font-family: var(--f-display); font-size: 17px; margin: 0 auto 0 0; text-transform: capitalize; }
  .cal-cab button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 13px; }
  .rejilla { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .dsem { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; text-align: center; padding-bottom: 4px; }
  .dia { min-height: 96px; border-radius: 10px; background: var(--sunk); border: 2px solid transparent; padding: 5px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; overflow: hidden; }
  .dia.fuera { opacity: .6; }
  .dia.hoy .num { background: var(--accent); color: var(--accent-ink); }
  .dia.sel { border-color: var(--accent); }
  .dia .num { font-size: 12.5px; font-weight: 700; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .ev { font-size: 11.5px; line-height: 1.25; border-radius: 5px; padding: 2px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--accent-soft); color: var(--ink); }
  .ev.t-llamada { background: var(--rosa-soft); }
  .ev.t-plazo { background: var(--warn-soft); }
  .ev.t-otro { background: var(--surface); }
  .ev.tarea { background: transparent; border: 1px dashed var(--line); }
  .ev.tarea.hecha { text-decoration: line-through; color: var(--muted); }
  .mas { font-size: 11px; color: var(--muted); padding-left: 4px; }
  .lateral { display: grid; gap: 14px; min-width: 0; }
  .panel { background: var(--surface); border-radius: 16px; box-shadow: var(--sombra); padding: 14px 16px; min-width: 0; }
  .panel h3 { font-family: var(--f-display); font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .panel h3 .btn { margin-left: auto; padding: 4px 10px; font-size: 12.5px; font-family: var(--f-body); }
  .item { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .item .hora { font-size: 12.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
  .item .que { border: 0; background: none; padding: 0; text-align: left; font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
  .item .que:hover { color: var(--accent); }
  .item .sub { grid-column: 2; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .agenda-dia { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--rosa); margin: 12px 0 2px; }
  .agenda-dia:first-child { margin-top: 0; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .leyenda span { display: inline-flex; align-items: center; gap: 5px; }
  .leyenda i { width: 12px; height: 9px; border-radius: 3px; display: inline-block; }

  /* Notes */
  .notas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; padding-bottom: 40px; padding-top: 10px; }
  .nota { background: var(--surface); border-radius: 16px; box-shadow: var(--sombra); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .nota.fijada { outline: 2px solid var(--rosa); outline-offset: -2px; }
  .nota h3 { font-family: var(--f-display); font-size: 14.5px; margin: 0; line-height: 1.3; overflow-wrap: anywhere; }
  .nota .txt { white-space: pre-wrap; font-size: 14px; overflow-wrap: anywhere; }
  .nota .pie { margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .nota .pie button { margin-left: auto; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
  .fijo { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--rosa); }

  /* Sheet (form) */
  .velo { position: fixed; inset: 0; background: rgba(8,8,24,.5); z-index: 20; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .hoja { background: var(--surface); color: var(--ink); border-radius: 18px; width: min(520px, 100%); max-height: 100%; overflow: auto; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .hoja h2 { font-family: var(--f-display); font-size: 18px; margin: 0 0 14px; }
  .campos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .campo { display: grid; gap: 5px; min-width: 0; }
  .campo.ancho { grid-column: 1 / -1; }
  .campo label, .campo .lbl { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
  .campo input, .campo select, .campo textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 11px; }
  .campo textarea { min-height: 90px; resize: vertical; }
  .hoja .pie-hoja { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .hoja .pie-hoja .der { margin-left: auto; display: flex; gap: 8px; }
  .chk-linea { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }

  .toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; z-index: 30; max-width: calc(100% - 32px); }

  @media (max-width: 900px) {
    .tablero { grid-template-columns: minmax(0, 1fr); }
    .cal-wrap { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 640px) {
    .cifras { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dia { min-height: 54px; padding: 3px; }
    .dia .ev { font-size: 0; padding: 0; height: 6px; border-radius: 3px; }
    .dia .mas { display: none; }
    .campos { grid-template-columns: 1fr; }
    .barra .acciones { margin-left: 0; width: 100%; }
    .filtros label.chk { margin-left: 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .tarjeta, .nota, .dia { transition: transform .15s ease, box-shadow .15s ease; }
  }
</style>
<style>
  html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  [hidden] { display: none !important; }
  .usuario { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--band-muted); }
  .usuario button { border: 1px solid rgba(255,246,236,.25); background: transparent; color: var(--band-ink); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 700; }
  .entrada { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--band); color: var(--band-ink); padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
  .entrada__caja { width: min(380px, 100%); text-align: center; display: grid; gap: 18px; }
  .entrada h1 { font-family: var(--f-display); font-size: 30px; margin: 0; letter-spacing: -.02em; }
  .entrada h1 span { color: var(--rosa-band); }
  .entrada p { margin: 0; color: var(--band-muted); }
  .pregunta { font-family: var(--f-display); font-size: 17px; color: var(--band-ink) !important; }
  .nombres { display: grid; gap: 10px; }
  .nombre { display: flex; align-items: center; gap: 12px; background: rgba(255,246,236,.08); border: 1px solid rgba(255,246,236,.18); color: var(--band-ink); border-radius: 14px; padding: 12px 16px; font-size: 16px; font-weight: 700; text-align: left; }
  .nombre:hover { background: rgba(255,246,236,.14); }
  .nombre .ini { width: 34px; height: 34px; font-size: 12px; color: #fff; }
  .form-codigo { display: grid; gap: 10px; text-align: left; }
  .form-codigo label { font-size: 13px; font-weight: 700; color: var(--band-muted); }
  .form-codigo input { width: 100%; border: 1px solid rgba(255,246,236,.25); background: rgba(255,246,236,.06); color: var(--band-ink); border-radius: 12px; padding: 12px 14px; font-size: 18px; letter-spacing: .2em; }
  .btn-entrar { background: var(--rosa-band); color: #0E0E2C; border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 700; font-size: 15px; }
  .btn-entrar:disabled { opacity: .7; }
  .enlace { background: none; border: 0; color: var(--band-muted); text-decoration: underline; font-size: 13.5px; padding: 4px; justify-self: center; }
  .btn-google { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: #fff; color: #1f1f1f; border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 700; font-size: 15px; }
  .btn-google svg { width: 18px; height: 18px; }
  .entrada .error { background: rgba(255,122,146,.15); color: #FFC2CD; border-radius: 12px; padding: 10px 12px; font-size: 14px; }
</style>

<style>
  /* Added sections: compras, contabilidad, proveedores, contenido, enlaces, actividad, pasos y comentarios. */
  .barra { flex-direction: column; align-items: stretch; }
  .barra .fila { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .pestanas { overflow-x: auto; max-width: 100%; scrollbar-width: none; }
  .pestanas::-webkit-scrollbar { display: none; }
  .pestana { white-space: nowrap; }
  .pestana .cuenta { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--warn); color: #fff; font-size: 11px; line-height: 18px; }
  .vista-cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding-block: 10px 4px; }
  .vista-cab h2 { font-family: var(--f-display); font-size: 18px; margin: 0; }
  .vista-cab p { margin: 0; color: var(--muted); font-size: 14px; }
  .vista-cab .acciones-vista { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .rejilla-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; padding-block: 10px 40px; }
  .kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 14px; overflow-x: auto; padding-block: 10px 40px; }
  .card { background: var(--surface); border-radius: 16px; box-shadow: var(--sombra); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }

<script type="module">
import { iniciar } from './nube.js';

const PERSONAS = {
  jc: { n: 'José Carlos', i: 'JC' },
  alejandro: { n: 'Alejandro', i: 'AM' },
  hugo: { n: 'Hugo', i: 'HM' },
  todos: { n: 'Los tres', i: '3' }
};
const SOCIOS = ['jc', 'alejandro', 'hugo'];
const AREAS = ['Proveedores', 'Tienda online', 'Marketing', 'Legal y gestoría', 'Teléfono y WhatsApp', 'Otros'];
const EST_TAREA = [['pendiente', 'Por hacer'], ['marcha', 'En marcha'], ['hecho', 'Hecho']];
const TIPOS_EV = { reunion: 'Reunión', llamada: 'Llamada', plazo: 'Plazo o entrega', otro: 'Otro' };
const EST_PROV = [['contactar', 'Por contactar'], ['esperando', 'Esperando respuesta'], ['decidir', 'Nos toca decidir'], ['acuerdo', 'Acuerdo cerrado'], ['descartado', 'Descartado']];
const CLASE_PROV = { contactar: '', esperando: 'azul', decidir: 'warn', acuerdo: 'ok', descartado: 'bad' };
const TIPOS_PROV = [['colchones', 'Colchones'], ['canapes', 'Canapés y bases'], ['ambos', 'Colchones y canapés']];
const PRIORIDADES = [['alta', 'Prioridad alta'], ['media', 'Prioridad media'], ['baja', 'Prioridad baja']];
const EST_COMPRA = [['borrador', 'Por pedir'], ['pedido', 'Pedido enviado'], ['confirmado', 'Confirmado'], ['fabricacion', 'En fabricación'], ['listo', 'Listo para recoger'], ['recibido', 'Recibido'], ['cancelado', 'Cancelado']];
const ABIERTA = (c) => !['recibido', 'cancelado'].includes(c.estado);
const EST_CON = [['idea', 'Idea'], ['guion', 'Guion'], ['grabado', 'Grabado'], ['editado', 'Editado'], ['publicado', 'Publicado']];
const CAT_GASTO = ['Producto y proveedores', 'Envíos y transporte', 'Tienda online y apps', 'Publicidad y marketing', 'Teléfono e internet', 'Gestoría y legal', 'Material y muestras', 'Otros gastos'];
const CAT_INGRESO = ['Ventas', 'Aportación de socios', 'Otros ingresos'];
const IVAS = [['21', '21 %'], ['10', '10 %'], ['4', '4 %'], ['0', 'Sin IVA']];
const REDES = ['Instagram y TikTok', 'Instagram', 'TikTok', 'Facebook', 'YouTube'];
const FORMATOS = ['Vídeo vertical', 'Carrusel', 'Foto', 'Historia'];
const VISTAS = [['tareas', 'Tareas'], ['calendario', 'Calendario'], ['compras', 'Compras'], ['contabilidad', 'Contabilidad'], ['proveedores', 'Proveedores'], ['contenido', 'Contenido'], ['notas', 'Notas'], ['enlaces', 'Enlaces'], ['actividad', 'Actividad']];
const COLS = ['tareas', 'eventos', 'notas', 'movimientos', 'proveedores', 'compras', 'contenido', 'enlaces'];
const MAX_PDF = 700 * 1024;

const S = {
  db: null, yo: null, escribir: true, actividad: [], listo: {},
  vista: 'tareas', persona: 'all', area: 'all', soloVencidas: false, verHechas: true, verCerrados: false,
  periodo: 'anio', filtroMov: 'todos', filtroProv: 'todos', verDescartados: false, mes: null, dia: null
};
COLS.forEach((c) => { S[c] = []; S.listo[c] = false; });
S.listo.actividad = false;

/* ---------- Helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const deIso = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const hoyIso = () => iso(new Date());
const sumaDias = (s, n) => { const d = deIso(s); d.setDate(d.getDate() + n); return iso(d); };
const difDias = (a, b) => Math.round((deIso(b) - deIso(a)) / 86400000);
const fCorta = new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short' });
const fLarga = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
const fMes = new Intl.DateTimeFormat('es-ES', { month: 'long', year: 'numeric' });
const fNum = new Intl.NumberFormat('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const euros = (n) => fNum.format(n || 0) + ' €';
const num = (v) => { const n = parseFloat(String(v || '').replace(/\s/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
const nuevoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nombre = (p) => p === 'comun' ? 'Cuenta de la empresa' : (PERSONAS[p] || PERSONAS.todos).n;
const etiqueta = (lista, k) => (lista.find((x) => x[0] === k) || lista[0])[1];
const textoFecha = (s) => {
  if (!s) return '';
  const h = hoyIso();
  if (s === h) return 'Hoy';
  if (s === sumaDias(h, 1)) return 'Mañana';
  if (s === sumaDias(h, -1)) return 'Ayer';
  const d = deIso(s);
  return fCorta.format(d).replace('.', '') + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
};
const haceCuanto = (isoStr) => {
  const min = Math.round((Date.now() - new Date(isoStr).getTime()) / 60000);
  if (min < 1) return 'ahora';
  if (min < 60) return 'hace ' + min + ' min';
  if (min < 24 * 60) return 'hace ' + Math.round(min / 60) + ' h';
  return textoFecha(iso(new Date(isoStr)));
};
const leer = (k, def) => { try { const v = localStorage.getItem('dormily-panel-' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } };
const guardarLocal = (k, v) => { try { localStorage.setItem('dormily-panel-' + k, JSON.stringify(v)); } catch (e) {} };
const urlSegura = (u) => { u = String(u || '').trim(); if (!u) return ''; if (!/^https?:\/\//i.test(u)) u = 'https://' + u; try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; } };

S.persona = leer('persona', 'all');
S.verHechas = leer('verHechas', true);
S.periodo = leer('periodo', 'anio');
S.dia = hoyIso();
S.mes = S.dia.slice(0, 7);

let toastT;
function aviso(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200);
}
function conexion(estado, texto) {
  const c = $('conexion'); c.className = 'estado-con ' + estado; c.lastElementChild.textContent = texto;
}
function soloLectura(motivo) {
  S.escribir = false;
  document.body.classList.add('solo-lectura');
  $('avisos').innerHTML = '<div class="aviso">' + esc(motivo) + '</div>';
  render();
}
function registrar(texto) {
  if (!S.db || !S.yo) return;
  S.db.collection('actividad').add({ quien: S.yo, texto, fecha: new Date().toISOString() }).catch(() => {});
}
async function escribir(fn, hecho, actividad) {
  if (!S.db) { aviso('Sin conexión con los datos: no se ha guardado.'); return false; }
  try {
    await fn();
    if (hecho) aviso(hecho);
    if (actividad) registrar(actividad);
    return true;
  } catch (e) {
    const c = e && e.code;
    if (c === 'permission-denied') soloLectura('No hay permiso para cambiar los datos. Sal y vuelve a entrar con el código del equipo.');
    else if (c === 'invalid-argument' || c === 'resource-exhausted') aviso('El archivo o el texto es demasiado grande para guardarlo.');
    else aviso('No se ha podido guardar. Inténtalo de nuevo en un momento.');
    return false;
  }
}
function personaHtml(p) {
  if (p === 'comun') return '<span class="pers"><span class="ini" style="background:var(--muted)">€</span>Empresa</span>';
  const k = PERSONAS[p] ? p : 'todos';
  return '<span class="pers"><span class="ini" style="background:var(--p-' + k + ')">' + esc(PERSONAS[k].i) + '</span>' + esc(PERSONAS[k].n) + '</span>';
}
function gcalUrl({ titulo, fecha, hora, detalles, lugar }) {
  const f = fecha.replace(/-/g, '');
  let fechas;
  if (hora) {
    const [h, m] = hora.split(':').map(Number);
    const fin = new Date(deIso(fecha)); fin.setHours(h + 1, m);
    fechas = f + 'T' + pad(h) + pad(m) + '00/' + iso(fin).replace(/-/g, '') + 'T' + pad(fin.getHours()) + pad(fin.getMinutes()) + '00';
  } else {
    fechas = f + '/' + sumaDias(fecha, 1).replace(/-/g, '');
  }
  const q = new URLSearchParams({ action: 'TEMPLATE', text: titulo, dates: fechas, ctz: 'Europe/Madrid' });
  if (detalles) q.set('details', detalles);
  if (lugar) q.set('location', lugar);
  return 'https://calendar.google.com/calendar/render?' + q.toString();
}

/* ---------- Derived data ---------- */
// A purchase order needs attention when it is ready to collect or its expected date has passed.
const compraAviso = (c) => c.estado === 'listo' || (ABIERTA(c) && c.estado !== 'borrador' && c.fechaPrevista && c.fechaPrevista < hoyIso());
function ivaDe(m) { const t = m.importe || 0, p = Number(m.iva || 0); const base = Math.round((t / (1 + p / 100)) * 100) / 100; return { base, cuota: Math.round((t - base) * 100) / 100 }; }
function enPeriodo(fecha) {
  if (S.periodo === 'todo') return true;
  if (!fecha) return false;
  const h = hoyIso();
  if (S.periodo === 'mes') return fecha.slice(0, 7) === h.slice(0, 7);
  if (S.periodo === 'anio') return fecha.slice(0, 4) === h.slice(0, 4);
  const tri = (s) => s.slice(0, 4) + '-' + Math.floor((Number(s.slice(5, 7)) - 1) / 3);
  return tri(fecha) === tri(h);
}
function saldosSocios() {
  const r = {};
  SOCIOS.forEach((s) => { r[s] = { pagado: 0, toca: 0, cobrado: 0, corresponde: 0, pagos: 0, neto: 0 }; });
  S.movimientos.forEach((m) => {
    const imp = m.importe || 0;
    const reparto = (m.reparto || []).filter((x) => r[x]);
    if (!r[m.pagadoPor] || !reparto.length) return;
    const parte = imp / reparto.length;
    if (m.tipo === 'gasto') { r[m.pagadoPor].pagado += imp; reparto.forEach((x) => { r[x].toca += parte; }); }
    else if (m.tipo === 'ingreso') { r[m.pagadoPor].cobrado += imp; reparto.forEach((x) => { r[x].corresponde += parte; }); }
    else if (m.tipo === 'pago') { r[m.pagadoPor].pagos += imp; reparto.forEach((x) => { r[x].pagos -= parte; }); }
  });
  SOCIOS.forEach((s) => { const x = r[s]; x.neto = Math.round((x.pagado - x.toca - x.cobrado + x.corresponde + x.pagos) * 100) / 100; });
  return r;
}
function liquidar(saldos) {
  const acreedores = SOCIOS.filter((s) => saldos[s].neto > 0.005).map((s) => ({ s, v: saldos[s].neto }));
  const deudores = SOCIOS.filter((s) => saldos[s].neto < -0.005).map((s) => ({ s, v: -saldos[s].neto }));
  const pagos = [];
  acreedores.sort((a, b) => b.v - a.v); deudores.sort((a, b) => b.v - a.v);
  let i = 0, j = 0;
  while (i < deudores.length && j < acreedores.length) {
    const v = Math.min(deudores[i].v, acreedores[j].v);
    if (v > 0.005) pagos.push({ de: deudores[i].s, a: acreedores[j].s, v: Math.round(v * 100) / 100 });
    deudores[i].v -= v; acreedores[j].v -= v;
    if (deudores[i].v < 0.005) i++;
    if (acreedores[j].v < 0.005) j++;
  }
  return pagos;
}

function itemsDelDia(s) {
  const out = [];
  S.eventos.filter((e) => e.fecha === s).forEach((e) => out.push({ c: 't-' + (e.tipo || 'otro'), h: e.hora || '', t: e.titulo, sub: (TIPOS_EV[e.tipo] || 'Evento') + (e.lugar ? ' · ' + e.lugar : ''), a: 'eventos:' + e.id, o: e.hora || '00:00', ev: e }));
  S.tareas.filter((t) => t.fecha === s).forEach((t) => out.push({ c: 'tarea' + (t.estado === 'hecho' ? ' hecha' : ''), h: 'Límite', t: t.titulo, sub: nombre(t.responsable) + ' · ' + etiqueta(EST_TAREA, t.estado), a: 'tareas:' + t.id, o: '98' }));
  S.compras.filter((c) => c.fechaPrevista === s && c.estado !== 'cancelado').forEach((c) => out.push({ c: 'pedido' + (c.estado === 'recibido' ? ' hecha' : ''), h: 'Compra', t: (c.estado === 'listo' ? 'Recoger: ' : 'Llega: ') + (c.proveedor || '') + (c.referencia ? ' #' + c.referencia : ''), sub: etiqueta(EST_COMPRA, c.estado) + (c.que ? ' · ' + c.que.split('\n')[0] : ''), a: 'compras:' + c.id, o: '50' }));
  S.contenido.filter((c) => c.fecha === s).forEach((c) => out.push({ c: 'contenido' + (c.estado === 'publicado' ? ' hecha' : ''), h: 'Publicar', t: c.titulo, sub: (c.red || '') + ' · ' + etiqueta(EST_CON, c.estado), a: 'contenido:' + c.id, o: '60' }));
  S.proveedores.filter((p) => p.fechaSiguiente === s && p.estado !== 'descartado').forEach((p) => out.push({ c: 'proveedor', h: 'Prov.', t: p.nombre + ': ' + (p.siguientePaso || 'siguiente paso'), sub: etiqueta(EST_PROV, p.estado), a: 'proveedores:' + p.id, o: '70' }));
  return out.sort((a, b) => a.o.localeCompare(b.o));
}

}
function renderCalendario() {
  const [y, m] = S.mes.split('-').map(Number);

  const inicio = new Date(y, m - 1, 1 - ((primero.getDay() + 6) % 7));

  }

    (delDia.length ? delDia.map(itemLista).join('') : '<p style="margin:0;color:var(--muted);font-size:14px">Nada este día.</p>');
  let agenda = '<h3>Próximos 14 días</h3>';

/* ---------- Contabilidad ---------- */
function renderContabilidad() {
  const enP = S.movimientos.filter((m) => enPeriodo(m.fecha));
  let ingresos = 0, gastos = 0, ivaRep = 0, ivaSop = 0;
  const porCat = {};
  enP.forEach((m) => {

    if (m.tipo === 'ingreso') { ingresos += m.importe || 0; ivaRep += cuota; }
    if (m.tipo === 'gasto') { gastos += m.importe || 0; ivaSop += cuota; porCat[m.categoria || 'Otros gastos'] = (porCat[m.categoria || 'Otros gastos'] || 0) + (m.importe || 0); }
  });
  const resultado = ingresos - gastos;
  const periodos = [['mes', 'Este mes'], ['trimestre', 'Este trimestre'], ['anio', 'Este año'], ['todo', 'Todo']];
  let html = cabecera('Contabilidad', 'Gastos, ingresos y facturas. Las cuentas de IVA son orientativas: confírmalas con la gestoría.',
    '<select id="f-periodo" aria-label="Periodo">' + periodos.map(([k, n]) => '<option value="' + k + '"' + (S.periodo === k ? ' selected' : '') + '>' + n + '</option>').join('') + '</select>' +
    '<button class="btn" type="button" id="exportar">Exportar CSV</button><button class="btn" type="button" data-nuevo="ingreso">+ Ingreso</button><button class="btn primario" type="button" data-nuevo="gasto">+ Gasto</button>');
  html += '<div class="kpis-cont">' +
    [['Ingresos', ingresos, 'pos'], ['Gastos', gastos, 'neg'], ['Resultado', resultado, resultado >= 0 ? 'pos' : 'neg'], ivaRep - ivaSop >= 0 ? ['IVA a pagar (orient.)', ivaRep - ivaSop, ''] : ['IVA a devolver (orient.)', ivaSop - ivaRep, '']]
      .map(([n, v, c]) => '<div class="saldo"><span style="color:var(--muted);font-size:13px">' + n + '</span><span class="neto ' + c + '">' + euros(v) + '</span></div>').join('') + '</div>';

  const saldos = saldosSocios();
  const paz = liquidar(saldos);
  html += '<h3 class="grupo-titulo">Cuentas entre socios <span class="n">desde el principio</span></h3><div class="saldos">' + SOCIOS.map((s) => {
    const x = saldos[s];
    return '<div class="saldo"><div class="quien">' + personaHtml(s) + '</div><dl>' +

      (x.corresponde ? '<dt>Le corresponde de esos cobros</dt><dd>' + euros(x.corresponde) + '</dd>' : '') +
      (x.pagos > 0.005 ? '<dt>Ha pagado a otros socios</dt><dd>' + euros(x.pagos) + '</dd>' : x.pagos < -0.005 ? '<dt>Ha recibido de otros socios</dt><dd>' + euros(-x.pagos) + '</dd>' : '') +
      '</dl><span class="neto ' + (x.neto > 0.005 ? 'pos' : x.neto < -0.005 ? 'neg' : '') + '">' + (x.neto > 0.005 ? 'Le deben ' + euros(x.neto) : x.neto < -0.005 ? 'Debe ' + euros(-x.neto) : 'En paz') + '</span></div>';
  }).join('') + '</div>';
  html += '<div class="panel" style="margin-top:14px"><h3>Para quedar en paz' + (S.escribir ? '<button class="btn" type="button" data-nuevo="pago">Registrar pago entre socios</button>' : '') + '</h3><div class="paz">' +

function leerCampos(campos, form) {
  const d = {};
  campos.forEach((c) => {
    if (c.t === 'sep') return;
    if (c.t === 'check') d[c.n] = form.elements[c.n].checked;
    else if (c.t === 'socios') d[c.n] = Array.from(form.querySelectorAll('input[name="' + c.n + '"]:checked')).map((x) => x.value);
    else if (c.t === 'dinero') d[c.n] = num(form.elements[c.n].value);
    else d[c.n] = String(form.elements[c.n].value || '').trim();
  });
  return d;
}

function abrirHoja({ titulo, campos, valores = {}, extra = '', alGuardar, alBorrar, alMontar }) {

  const form = $('hoja');
  const primero = form.querySelector('input:not([type=checkbox]):not([type=file]), textarea, select'); if (primero) primero.focus();
  $('cancelar').onclick = cerrar;
  $('velo').addEventListener('mousedown', (e) => { if (e.target.id === 'velo') cerrar(); });
  form.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrar(); });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (falta) { aviso('Falta: ' + falta.l.toLowerCase() + '.'); const el = form.elements[falta.n]; if (el && el.focus) el.focus(); return; }
    const b = $('guardar'); b.disabled = true; b.textContent = 'Guardando…';
    const ok = await alGuardar(d, form);
    if (ok) cerrar(); else if ($('guardar')) { $('guardar').disabled = false; $('guardar').textContent = 'Guardar'; }
  });
  if (alBorrar) {

  }

}

/* Attachments: images are shrunk to JPEG; PDFs up to 700 KB. Each one is its own document in «adjuntos». */
function leerComoDataURL(f) {
  return new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => mal(r.error); r.readAsDataURL(f); });
}
async function prepararArchivo(f) {
  if (f.type === 'application/pdf') {
    if (f.size > MAX_PDF) throw new Error('«' + f.name + '» pesa ' + Math.round(f.size / 1024) + ' KB. El máximo para PDF es 700 KB: comprímelo o pega un enlace de Drive.');
    return { id: nuevoId(), nombre: f.name, tipo: f.type, tamano: f.size, datos: await leerComoDataURL(f) };
  }
  if (!f.type.startsWith('image/')) throw new Error('«' + f.name + '» no es una foto ni un PDF.');
  const url = await leerComoDataURL(f);
  const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => mal(new Error('No se puede leer la foto «' + f.name + '».')); i.src = url; });
  for (const [lado, calidad] of [[1800, 0.75], [1400, 0.65], [1100, 0.55]]) {
    const k = Math.min(1, lado / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const datos = c.toDataURL('image/jpeg', calidad);
    if (datos.length < 900000) return { id: nuevoId(), nombre: f.name.replace(/\.[^.]+$/, '') + '.jpg', tipo: 'image/jpeg', tamano: Math.round(datos.length * 0.75), datos };
  }
  throw new Error('La foto «' + f.name + '» es demasiado grande incluso reducida.');
}
async function verAdjunto(a, local) {
  const w = window.open('', '_blank');
  try {
    let datos = local && local.datos;
    if (!datos) { const d = await col('adjuntos').doc(a.id).get(); datos = d && d.datos; }
    if (!datos) throw new Error('no');
    const blob = await (await fetch(datos)).blob();
    const url = URL.createObjectURL(blob);
    if (w) w.location = url; else { const x = document.createElement('a'); x.href = url; x.download = a.nombre; x.click(); }
  } catch (e) { if (w) w.close(); aviso('No se ha podido abrir la factura.'); }
}

    { n: 'notas', l: 'Guion o notas', t: 'textarea', ancho: true },
    { n: 'enlace', l: 'Enlace al vídeo o a la publicación', ancho: true, max: 500 }
  ];
  abrirHoja({
    titulo: nuevo ? 'Nueva idea' : 'Contenido', campos, valores: c,
    alGuardar(d) {
      if (d.enlace) d.enlace = urlSegura(d.enlace);
      d.actualizado = new Date().toISOString();
      if (nuevo) return escribir(() => col('contenido').add(Object.assign(d, { creadoPor: S.yo })), 'Idea añadida', 'añadió la idea «' + d.titulo + '»');
      return escribir(() => col('contenido').doc(c.id).update(d), 'Guardado', d.estado !== c.estado ? 'pasó «' + d.titulo + '» a ' + etiqueta(EST_CON, d.estado).toLowerCase() : 'editó «' + d.titulo + '»');
    },
    alBorrar: nuevo ? null : () => escribir(() => col('contenido').doc(c.id).delete(), 'Eliminado', 'borró la idea «' + c.titulo + '»')
  });
}
function formNota(n) {
  const nueva = !n;
  n = n || { autor: S.yo || 'jc' };
  const campos = [
    { n: 'titulo', l: 'Título', req: true, ancho: true, max: 160 },
    { n: 'texto', l: 'Texto', t: 'textarea', ancho: true, max: 8000 },
    { n: 'autor', l: 'Quién la escribe', t: 'select', op: Object.keys(PERSONAS).map((k) => [k, PERSONAS[k].n]) },
    { n: 'fijada', l: 'Fijar arriba', t: 'check' }
  ];
  abrirHoja({
    titulo: nueva ? 'Nueva nota' : 'Nota', campos, valores: n,
    alGuardar(d) {
      d.fecha = n.fecha || new Date().toISOString();
      if (nueva) return escribir(() => col('notas').add(d), 'Nota creada', 'creó la nota «' + d.titulo + '»');
      return escribir(() => col('notas').doc(n.id).update(d), 'Nota guardada', 'editó la nota «' + d.titulo + '»');
    },
    alBorrar: nueva ? null : () => escribir(() => col('notas').doc(n.id).delete(), 'Nota eliminada', 'borró la nota «' + n.titulo + '»')
  });
}
function formEnlace(l) {
  const nuevo = !l;
  l = l || { grupo: 'Herramientas' };
  const grupos = Array.from(new Set(['Tienda', 'Herramientas', 'Panel', 'Documentos'].concat(S.enlaces.map((x) => x.grupo).filter(Boolean))));
  const campos = [
    { n: 'titulo', l: 'Nombre', req: true, max: 120 },
    { n: 'grupo', l: 'Grupo', lista: grupos, max: 60 },
    { n: 'url', l: 'Dirección (URL)', req: true, ancho: true, max: 500, ph: 'https://' },
    { n: 'notas', l: 'Nota corta (opcional)', ancho: true, max: 160 }
  ];
  abrirHoja({
    titulo: nuevo ? 'Nuevo enlace' : 'Enlace', campos, valores: l,
    alGuardar(d) {
      d.url = urlSegura(d.url);
      if (!d.url) { aviso('La dirección no es válida.'); return false; }
      if (nuevo) return escribir(() => col('enlaces').add(Object.assign(d, { orden: 100 + S.enlaces.length })), 'Enlace añadido', 'añadió el enlace ' + d.titulo);
      return escribir(() => col('enlaces').doc(l.id).update(d), 'Enlace guardado');
    },
    alBorrar: nuevo ? null : () => escribir(() => col('enlaces').doc(l.id).delete(), 'Enlace eliminado', 'borró el enlace ' + l.titulo)
  });
}
const ABRIR = { tareas: formTarea, eventos: formEvento, compras: formCompra, movimientos: (m) => formMovimiento(m), proveedores: formProveedor, contenido: formContenido, notas: formNota, enlaces: formEnlace };
const NUEVO = { tarea: () => formTarea(), evento: () => formEvento(null, S.vista === 'calendario' ? S.dia : hoyIso()), compra: () => formCompra(), gasto: () => formMovimiento(null, 'gasto'), ingreso: () => formMovimiento(null, 'ingreso'), pago: () => formPago(), proveedor: () => formProveedor(), contenido: () => formContenido(), nota: () => formNota(), enlace: () => formEnlace() };

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const fila = e.target.closest('tr[data-abrir]');
  const b = e.target.closest('button') || fila;
  if (!b || !$('todo') || $('todo').hidden) return;
  if (b.closest('#capa')) return;
  if (b.dataset.vista) return irA(b.dataset.vista);
  if (b.dataset.ir) {
    const k = b.dataset.ir;
    if (k === 'calendario') return irA('calendario');
    S.soloVencidas = k === 'vencidas'; S.persona = 'all';
    return irA('tareas');
  }
  if (b.dataset.persona) { S.persona = b.dataset.persona; guardarLocal('persona', S.persona); return render(); }
  if (b.id === 'quitar-venc') { S.soloVencidas = false; return render(); }
  if (b.dataset.abrir) { const [c, id] = b.dataset.abrir.split(':'); const x = S[c].find((y) => y.id === id); if (x) ABRIR[c](x); return; }
  if (b.dataset.nuevo) { if (S.escribir) NUEVO[b.dataset.nuevo](); return; }
  if (b.dataset.marcar) {
    const t = S.tareas.find((x) => x.id === b.dataset.marcar); if (!t) return;
    const hecho = t.estado !== 'hecho';
    const cambio = hecho ? { estado: 'hecho', hechaPor: S.yo, hechaEn: new Date().toISOString(), actualizada: new Date().toISOString() } : { estado: 'pendiente', actualizada: new Date().toISOString() };
    return escribir(() => col('tareas').doc(t.id).update(cambio), hecho ? '¡Hecha!' : 'Vuelve a pendientes', hecho ? 'completó «' + t.titulo + '»' : 'reabrió «' + t.titulo + '»');
  }
  if (b.dataset.mover) {
    const [c, id, estado] = b.dataset.mover.split(':');
    const x = S[c].find((y) => y.id === id); if (!x) return;
    const cambio = { estado, actualizado: new Date().toISOString() };
    let texto;
    if (c === 'tareas') { cambio.actualizada = cambio.actualizado; delete cambio.actualizado; if (estado === 'hecho') { cambio.hechaPor = S.yo; cambio.hechaEn = new Date().toISOString(); } texto = (estado === 'hecho' ? 'completó «' : 'movió «') + x.titulo + '»' + (estado === 'hecho' ? '' : ' a ' + etiqueta(EST_TAREA, estado).toLowerCase()); }
    if (c === 'compras') { if (estado === 'recibido') cambio.fechaRecibido = hoyIso(); texto = 'pasó la compra a ' + (x.proveedor || '') + (x.referencia ? ' #' + x.referencia : '') + ' a «' + etiqueta(EST_COMPRA, estado).toLowerCase() + '»'; }
    if (c === 'contenido') texto = 'pasó «' + x.titulo + '» a ' + etiqueta(EST_CON, estado).toLowerCase();
    return escribir(() => col(c).doc(id).update(cambio), null, texto);
  }
  if (b.dataset.paz) { const [de, a, v] = b.dataset.paz.split(':'); return formPago(null, { de, a, v: Number(v) }); }
  if (b.dataset.chipmov) { S.filtroMov = b.dataset.chipmov; return render(); }
  if (b.dataset.chipprov) { S.filtroProv = b.dataset.chipprov; return render(); }
  if (b.id === 'exportar') return exportarCSV();
  if (b.dataset.dia) { S.dia = b.dataset.dia; if (S.dia.slice(0, 7) !== S.mes) S.mes = S.dia.slice(0, 7); return render(); }
  if (b.id === 'mes-ant' || b.id === 'mes-sig') { const [y, m] = S.mes.split('-').map(Number); S.mes = iso(new Date(y, m - 1 + (b.id === 'mes-sig' ? 1 : -1), 1)).slice(0, 7); return render(); }
  if (b.id === 'mes-hoy') { S.dia = hoyIso(); S.mes = S.dia.slice(0, 7); return render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-abrir]')) e.target.click();
});
document.addEventListener('change', (e) => {
  if (e.target.closest('#capa')) return;
  if (e.target.id === 'f-area') { S.area = e.target.value; render(); }
  if (e.target.id === 'f-hechas') { S.verHechas = e.target.checked; guardarLocal('verHechas', S.verHechas); render(); }
  if (e.target.id === 'f-cerrados') { S.verCerrados = e.target.checked; render(); }
  if (e.target.id === 'f-descartados') { S.verDescartados = e.target.checked; render(); }
  if (e.target.id === 'f-periodo') { S.periodo = e.target.value; guardarLocal('periodo', S.periodo); render(); }
});

/* ---------- Start ---------- */
$('hoy').textContent = fLarga.format(new Date()).replace(/^./, (c) => c.toUpperCase());
const inicial = (location.hash || '').slice(1);
if (VISTA_FN[inicial]) S.vista = inicial;

iniciar({
  alEntrar(usuario, db) {
    S.db = db; S.yo = usuario.persona;
    if (leer('persona', null) === null && usuario.persona) S.persona = usuario.persona;
    $('entrada').hidden = true; $('todo').hidden = false; $('entrada-error').hidden = true;
    $('usuario').hidden = false; $('usuario-nombre').textContent = usuario.nombre;
    let pendientes = COLS.length;
    const timer = setTimeout(() => { if (pendientes > 0) conexion('mal', 'Los datos no responden'); }, 10000);
    const fallo = (c) => (err) => {
      clearTimeout(timer);
      if (err.code === 'permission-denied') {
        $('todo').hidden = true; $('entrada').hidden = false; $('entrada-error').hidden = false;
        $('entrada-error').textContent = 'No hay acceso a los datos. Revisa que las reglas de Firestore estén publicadas (ver README).';
        return;
      }
      conexion('mal', 'Error al cargar'); S.listo[c] = true; render();
    };
    COLS.forEach((c) => db.collection(c).onSnapshot((snap) => {
      S[c] = snap.docs;
      if (!S.listo[c]) { S.listo[c] = true; pendientes--; if (pendientes === 0) { clearTimeout(timer); conexion('ok', 'Al día'); } }
      if (!$('capa').innerHTML) render(); else { renderCifras(); renderPestanas(); }
    }, fallo(c)));
    db.collection('actividad').ultimos('fecha', 80).onSnapshot((snap) => {
      S.actividad = snap.docs; S.listo.actividad = true;
      if (S.vista === 'actividad' && !$('capa').innerHTML) render();
    }, fallo('actividad'));
    render();
    const activa = $('pestanas').querySelector('[aria-selected="true"]');
    if (activa) $('pestanas').scrollLeft = activa.offsetLeft - 16;
  },
  alSalir() { $('todo').hidden = true; $('entrada').hidden = false; $('usuario').hidden = true; },
  alError(msg) { $('entrada-error').hidden = false; $('entrada-error').textContent = msg; }
});

// Re-render after a sheet closes so changes from the others show up.
new MutationObserver(() => { if (!$('capa').innerHTML && S.db) render(); }).observe($('capa'), { childList: true });
</script>
</body>
